# Project overrides layered on top of detekt's default rules
# (buildUponDefaultConfig = true). Only deviations from the defaults live here.

complexity:
  LongMethod:
    threshold: 45
    ignoreAnnotated: ['Composable', 'Preview']
  CyclomaticComplexMethod:
    ignoreAnnotated: ['Composable']
  TooManyFunctions:
    thresholdInFiles: 14
    thresholdInClasses: 15
    ignoreAnnotatedFunctions: ['Composable', 'Preview']

naming:
  FunctionNaming:
    ignoreAnnotated: ['Composable']

style:
  MagicNumber:
    # Tapio's core is a byte-level wire protocol (APDU headers, status words,
    # field offsets); the UI is full of layout constants. Inline reads clearer.
    active: false
  MaxLineLength:
    maxLineLength: 120
  UnusedPrivateMember:
    ignoreAnnotated: ['Composable', 'Preview']
